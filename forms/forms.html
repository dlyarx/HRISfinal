<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRIS - Form Builder</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
 
        body {
            background-color: #f7f4ed;
            color: #3b281a;
            min-height: 100vh;
            padding: 25px;
        }
 
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid #e8dec8;
            box-shadow: 0 4px 12px rgba(92, 58, 33, 0.05);
            margin-bottom: 20px;
        }
 
        .logo-title-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
 
        #cstaLogo {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }
 
        h1 {
            font-size: 1.4rem;
            color: #5c3a21;
        }
 
        .panel {
            background: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #e8dec8;
            box-shadow: 0 4px 12px rgba(92, 58, 33, 0.05);
        }
 
        h2 {
            font-size: 1.3rem;
            color: #5c3a21;
            border-bottom: 2px solid #f7f4ed;
            padding-bottom: 10px;
            margin-bottom: 8px;
        }
 
        h3 {
            font-size: 1rem;
            color: #5c3a21;
            margin: 22px 0 10px;
        }
 
        .desc {
            font-size: 0.95rem;
            color: #6b5344;
            margin-bottom: 20px;
        }
 
        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #4a3525;
            margin-bottom: 6px;
        }
 
        input[type="text"],
        select {
            padding: 10px 14px;
            border: 1px solid #d4c5b9;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #fff;
            color: #3b281a;
        }
 
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #5c3a21;
            box-shadow: 0 0 0 3px rgba(92, 58, 33, 0.15);
        }
 
        #formName {
            width: 100%;
        }
 
        #fieldList {
            list-style: none;
        }
 
        #fieldList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            background: #faf7f0;
            border: 1px solid #e8dec8;
            border-radius: 6px;
        }
 
        #fieldList .type {
            font-size: 0.8rem;
            color: #6b5344;
            margin-left: 8px;
        }
 
        .empty {
            color: #8c7362;
            font-style: italic;
            padding: 10px 0;
        }
 
        .add-row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
 
        .add-row input {
            flex: 1;
        }
 
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            background-color: #5c3a21;
            color: #fff;
            transition: background-color 0.2s;
        }
 
        button:hover {
            background-color: #7a4e2d;
        }
 
        button.secondary {
            background-color: #f0f0f0;
            color: #222;
            border: 1px solid #ccc;
        }
 
        button.secondary:hover {
            background-color: #e4e4e4;
        }
 
        button.remove {
            padding: 5px 12px;
            font-size: 0.8rem;
            background-color: #f0f0f0;
            color: #a34828;
            border: 1px solid #ccc;
        }
 
        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 28px;
        }
 
        /* Message box */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(59, 40, 26, 0.55);
            backdrop-filter: blur(3px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
 
        .modal-card {
            background: #fff;
            width: 90%;
            max-width: 420px;
            padding: 28px 28px 22px;
            border-radius: 12px;
            border: 1px solid #e8dec8;
            box-shadow: 0 15px 40px rgba(59, 40, 26, 0.35);
        }
 
        .modal-card h3 {
            margin: 0 0 10px;
            font-size: 1.15rem;
        }
 
        .modal-card p {
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
            margin-bottom: 22px;
        }
 
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
 
<body>
    <header>
        <div class="logo-title-group">
            <img src="../assets/cstaLogo1.png" alt="CSTA Logo" id="cstaLogo">
            <h1>Form Builder</h1>
        </div>
        <button type="button" id="btnBack" class="secondary">Back to Dashboard</button>
    </header>
 
    <main class="panel">
        <h2 id="pageTitle">Form</h2>
        <p class="desc" id="pageDesc"></p>
 
        <label for="formName">Form name</label>
        <input type="text" id="formName">
 
        <h3>Fields</h3>
        <ul id="fieldList"></ul>
 
        <div class="add-row">
            <input type="text" id="newFieldLabel" placeholder="Field label (e.g., Start Date)">
            <select id="newFieldType">
                <option value="Text">Text</option>
                <option value="Number">Number</option>
                <option value="Date">Date</option>
                <option value="Long Text">Long Text</option>
            </select>
            <button type="button" id="btnAddField">Add Field</button>
        </div>
 
        <div class="actions">
            <button type="button" id="btnCancel" class="secondary">Cancel</button>
            <button type="button" id="btnSave">Save Form</button>
        </div>
    </main>
 
    <!-- Custom Message Box -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <h3 id="modalTitle">Message</h3>
            <p id="modalMessage"></p>
            <div class="modal-buttons">
                <button type="button" id="modalCancelBtn" class="secondary" style="display: none;">Cancel</button>
                <button type="button" id="modalOkBtn">OK</button>
            </div>
        </div>
    </div>
 
    <script>
        // Only a logged-in HR staff member may view this page
        if (sessionStorage.getItem('hrisRole') !== 'hr') {
            window.location.replace('../HRIS.html');
        }
 
        const DASHBOARD = '../HomePageHRStaff.html';
 
        // Starting fields for the existing forms (used in update mode)
        const templates = {
            'Leave Form': [['Employee Name', 'Text'], ['Leave Type', 'Text'], ['Start Date', 'Date'], ['End Date', 'Date'], ['Reason', 'Long Text']],
            'Overtime Form': [['Employee Name', 'Text'], ['Date', 'Date'], ['Hours Rendered', 'Number'], ['Reason', 'Long Text']],
            'COE': [['Employee Name', 'Text'], ['Position', 'Text'], ['Purpose of Request', 'Text']],
            'Resignation Form': [['Employee Name', 'Text'], ['Last Working Day', 'Date'], ['Reason', 'Long Text']]
        };
 
        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') === 'update' ? 'update' : 'create';
        const title = (params.get('title') || '').trim();
 
        const formName = document.getElementById('formName');
        const fieldList = document.getElementById('fieldList');
        const newFieldLabel = document.getElementById('newFieldLabel');
        const newFieldType = document.getElementById('newFieldType');
 
        let fields = [];
 
        formName.value = title;
        if (mode === 'update') {
            document.getElementById('pageTitle').textContent = 'Update Form';
            document.getElementById('pageDesc').textContent = 'Review and change the fields of this form.';
            fields = (templates[title] || []).map(f => ({ label: f[0], type: f[1] }));
        } else {
            document.getElementById('pageTitle').textContent = 'Create Form';
            document.getElementById('pageDesc').textContent = 'Name your form and add the fields it needs.';
        }
 
        // ----- Message box -----
        const modal = document.getElementById('customModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalOkBtn = document.getElementById('modalOkBtn');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
 
        function openModal(message, title, isConfirm) {
            return new Promise(resolve => {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                modalCancelBtn.style.display = isConfirm ? 'inline-block' : 'none';
                modal.style.display = 'flex';
                modalOkBtn.focus();
 
                function close(result) {
                    modal.style.display = 'none';
                    modalOkBtn.removeEventListener('click', onOk);
                    modalCancelBtn.removeEventListener('click', onCancel);
                    document.removeEventListener('keydown', onKey);
                    resolve(result);
                }
                function onOk() { close(true); }
                function onCancel() { close(false); }
                function onKey(e) { if (e.key === 'Escape') close(!isConfirm); }
 
                modalOkBtn.addEventListener('click', onOk);
                modalCancelBtn.addEventListener('click', onCancel);
                document.addEventListener('keydown', onKey);
            });
        }
        const showAlert = (m, t = 'Notice') => openModal(m, t, false);
        const showConfirm = (m, t = 'Please Confirm') => openModal(m, t, true);
 
        // ----- Field list -----
        function render() {
            fieldList.innerHTML = '';
            if (fields.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'empty';
                empty.style.background = 'none';
                empty.style.border = 'none';
                empty.textContent = 'No fields yet. Add one below.';
                fieldList.appendChild(empty);
                return;
            }
            fields.forEach((f, i) => {
                const li = document.createElement('li');
                const text = document.createElement('span');
                text.textContent = f.label;
                const type = document.createElement('span');
                type.className = 'type';
                type.textContent = f.type;
                text.appendChild(type);
 
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'remove';
                btn.textContent = 'Remove';
                btn.addEventListener('click', () => { fields.splice(i, 1); render(); });
 
                li.appendChild(text);
                li.appendChild(btn);
                fieldList.appendChild(li);
            });
        }
 
        async function addField() {
            const label = newFieldLabel.value.trim();
            if (!label) {
                await showAlert('Please type a field label.', 'Missing Information');
                return;
            }
            if (fields.some(f => f.label.toLowerCase() === label.toLowerCase())) {
                await showAlert('That field already exists in this form.', 'Duplicate Field');
                return;
            }
            fields.push({ label: label, type: newFieldType.value });
            newFieldLabel.value = '';
            render();
        }
 
        document.getElementById('btnAddField').addEventListener('click', addField);
        newFieldLabel.addEventListener('keydown', e => { if (e.key === 'Enter') addField(); });
 
        document.getElementById('btnSave').addEventListener('click', async () => {
            const name = formName.value.trim();
            if (!name) {
                await showAlert('Please enter a form name.', 'Missing Information');
                return;
            }
            if (fields.length === 0) {
                await showAlert('Please add at least one field.', 'Missing Information');
                return;
            }
            if (await showConfirm(`Save "${name}" with ${fields.length} field(s)?`, 'Save Form')) {
                await showAlert(`"${name}" was saved successfully.`, 'Success');
                window.location.href = DASHBOARD;
            }
        });
 
        async function leave() {
            if (await showConfirm('Leave without saving your changes?', 'Cancel')) {
                window.location.href = DASHBOARD;
            }
        }
        document.getElementById('btnCancel').addEventListener('click', leave);
        document.getElementById('btnBack').addEventListener('click', leave);
 
        render();
    </script>
</body>
 
</html>
